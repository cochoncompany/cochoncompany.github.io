<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cochon & Co | Próximamente</title>
    <meta
      name="description"
      content="Muy pronto llega Cochon & Co. Perniles, eventos y una propuesta pensada para compartir."
    />

    <!-- Basic -->
    <link rel="icon" href="assets/img/favicon_io/favicon.ico" sizes="any" />

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon_io/favicon-16x16.png" />

    <!-- Apple (iOS) -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon_io/apple-touch-icon.png" />


    <!-- Theme color -->
    <meta name="theme-color" content="#0f0b09" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="coming-soon">
      <div class="video-bg">
        <video
          class="video-bg__media"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          poster="assets/img/9.jpg"
        >
          <source src="assets/video/video.mp4" type="video/mp4" />
          Tu navegador no soporta videos HTML5.
        </video>
      </div>

      <div class="coming-soon__overlay"></div>

      <div class="coming-soon__noise"></div>

      <section class="hero">
        <div class="hero__badge">COCHON &amp; CO</div>

        <h1 class="hero__title">
          Próximamente
          <span>una experiencia para compartir</span>
        </h1>

        <p class="hero__text">
          Muy pronto vas a conocer una nueva propuesta de perniles pensada para
          eventos, encuentros y momentos para compartir.
        </p>

        <div class="hero__actions">
          <a
            href="https://wa.me/5491136441214"
            class="btn btn--primary"
            target="_blank"
            rel="noopener noreferrer"
          >
            Consultanos
          </a>

          <a
            href="https://www.instagram.com/cochoncompany/"
            class="btn btn--ghost"
            target="_blank"
            rel="noopener noreferrer"
          >
            Instagram
          </a>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
